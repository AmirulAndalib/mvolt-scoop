name: CI

on:
  push:
    branches:
      - 'main'
      - 'master'
  pull_request:
  schedule:
    # Every 6 hours, so a broken upstream URL, a changed asset or a stalled update is caught even when nothing is pushed.
    - cron: '52 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout Bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need at least 2 commits to properly gather changed files for linting
          fetch-depth: 2
          path: 'my_bucket'
      - name: Checkout Scoop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ScoopInstaller/Scoop
          path: 'scoop_core'
      - name: Install and cache test dependencies
        uses: potatoqualitee/psmodulecache@9e4b63833c22c1768d648e115a9c849afdda22a5 # v6.3
        with:
          modules-to-cache: BuildHelpers, Pester
          shell: ${{ matrix.shell }}
      - name: Run tests
        run: |
          $env:SCOOP_HOME="$(Convert-Path '.\scoop_core')"
          .\my_bucket\bin\test.ps1
      - name: Manifests match scripts/Update-Manifests.ps1
        run: |
          $env:SCOOP_HOME="$(Convert-Path '.\scoop_core')"
          # The generator needs PowerShell 7, whichever shell this matrix leg uses.
          pwsh -NoProfile -File .\my_bucket\scripts\Update-Manifests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Update-Manifests.ps1 failed' }
          git -C "$(Convert-Path '.\my_bucket')" diff --exit-code -- bucket
          if ($LASTEXITCODE -ne 0) { throw 'bucket/*.json differ from scripts/Update-Manifests.ps1. Edit the script and run it, do not edit the hook code in the JSON.' }

  verify:
    name: Verify download
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout Bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check URLs, hashes and binaries
        run: |
          $ErrorActionPreference = 'Stop'
          $sources = [ordered]@{
            'mvolt'        = 'https://github.com/b00nz/mVolt/releases/download'
            'mvolt-mirror' = 'https://github.com/AmirulAndalib/mvolt-scoop/releases/download'
          }
          $hashes = @{}
          foreach ($app in $sources.Keys) {
            $m = Get-Content "bucket/$app.json" -Raw | ConvertFrom-Json
            $arch = $m.architecture.'64bit'
            $expectedUrl = "$($sources[$app])/v$($m.version)/mVolt+.exe"
            if ($arch.url -cne $expectedUrl) { throw "${app}: URL '$($arch.url)' does not match '$expectedUrl'" }
            $file = Join-Path $env:RUNNER_TEMP "$app.exe"
            Invoke-WebRequest -Uri $arch.url -OutFile $file -UseBasicParsing -MaximumRetryCount 3 -RetryIntervalSec 5
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            if ($hash -cne $arch.hash) { throw "${app}: hash mismatch, manifest $($arch.hash), download $hash" }
            $bytes = [IO.File]::ReadAllBytes($file)
            $pe = [BitConverter]::ToInt32($bytes, 0x3c)
            if ([BitConverter]::ToUInt16($bytes, $pe + 4) -ne 0x8664) { throw "${app}: download is not an x64 PE image" }
            $fileVersion = (Get-Item $file).VersionInfo.FileVersion
            if ($fileVersion -ne $m.version) { Write-Warning "${app}: embedded FileVersion '$fileVersion' differs from manifest version '$($m.version)'" }
            $hashes[$app] = "$($m.version) $hash"
            Write-Host "OK: $app $($m.version) $hash"
          }
          if ($hashes['mvolt'] -ne $hashes['mvolt-mirror']) {
            Write-Warning "mvolt ($($hashes['mvolt'])) and mvolt-mirror ($($hashes['mvolt-mirror'])) differ. The mirror may still be catching up."
          }
      - name: Check the WinGet manifests
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'winget'
          $installer = Get-Content "$dir/b00nz.mVolt.installer.yaml" -Raw
          function Get-Field([string]$Name) {
            if ($installer -cnotmatch "(?m)^\s*${Name}:\s*(\S+)\s*$") { throw "No $Name in the installer manifest" }
            $Matches[1]
          }
          $version = Get-Field 'PackageVersion'
          $url = Get-Field 'InstallerUrl'
          $hash = Get-Field 'InstallerSha256'
          $shipped = (Get-Content winget-version.txt -Raw).Trim()
          if ($shipped -ne $version) { throw "winget-version.txt says $shipped but $dir holds $version" }
          if (@(Get-ChildItem $dir).Count -ne 3) { throw "$dir must hold exactly the three b00nz.mVolt manifests" }
          # Re-render from the recorded values: the files must be exactly what the generator writes.
          $out = Join-Path $env:RUNNER_TEMP 'winget-render'
          ./scripts/New-WingetManifest.ps1 -Version $version -Tag "v$version" -InstallerUrl $url -Sha256 $hash -ReleaseDate (Get-Field 'ReleaseDate') -OutDir $out
          foreach ($f in Get-ChildItem $out) {
            $have = [IO.File]::ReadAllText((Join-Path $dir $f.Name)) -replace "`r`n", "`n"
            if ($have -cne [IO.File]::ReadAllText($f.FullName)) { throw "$dir/$($f.Name) differs from scripts/New-WingetManifest.ps1. Re-render it, do not edit it by hand." }
          }
          $file = Join-Path $env:RUNNER_TEMP 'winget-mVolt+.exe'
          Invoke-WebRequest -Uri $url -OutFile $file -UseBasicParsing -MaximumRetryCount 3 -RetryIntervalSec 5
          $got = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash
          if ($got -cne $hash) { throw "WinGet installer hash mismatch: manifest $hash, download $got" }
          $bytes = [IO.File]::ReadAllBytes($file)
          if ([BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3c) + 4) -ne 0x8664) { throw 'WinGet installer is not an x64 PE image' }
          # winget returns a nonzero code when validation passes with warnings, so read the text.
          $validate = (& winget validate --manifest $out 2>&1 | Out-String)
          Write-Host $validate.Trim()
          if ($validate -notmatch 'Manifest validation succeeded') { throw 'winget validate failed' }
          Write-Host "OK: b00nz.mVolt $version $got"
          exit 0
      - name: Check both packages follow the latest stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          # /releases/latest never returns drafts or prereleases.
          $raw = gh api repos/b00nz/mVolt/releases/latest 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::Could not read the latest upstream release: $raw"
            exit 0
          }
          $latest = $raw | ConvertFrom-Json
          $latestVersion = $latest.tag_name -replace '^v', ''
          $age = (Get-Date).ToUniversalTime() - ([datetime]$latest.published_at).ToUniversalTime()
          $behind = @()
          foreach ($app in 'mvolt', 'mvolt-mirror') {
            $have = (Get-Content "bucket/$app.json" -Raw | ConvertFrom-Json).version
            if ($have -eq $latestVersion) { Write-Host "${app}: on the latest stable release ($latestVersion)"; continue }
            $msg = "${app} is on $have, upstream latest is $latestVersion (published $([int]$age.TotalHours) hours ago)."
            if ($age.TotalHours -lt 6) { Write-Host "::notice::$msg The hourly Update workflow should catch up soon." }
            else { $behind += $msg }
          }
          if ($behind.Count -gt 0) {
            $behind | ForEach-Object { Write-Host "::error::$_" }
            throw 'A package has not followed upstream for over 6 hours. Check the Update workflow runs.'
          }

