name: Update

on:
  schedule:
    # Hourly, at an off-peak minute. GitHub delays or skips scheduled runs under load, so
    # running often keeps both packages close to upstream even when some runs are dropped.
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror upstream releases
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Mirror
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The script reads the target repository from GITHUB_REPOSITORY.
        run: ./scripts/mirror-releases.ps1

  excavate:
    name: Update manifests
    # Runs only after the mirror job, so mvolt and mvolt-mirror move to a new version together.
    needs: mirror
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Excavate
        uses: ScoopInstaller/GithubActions@5bceeda181721d9d10a18fdcc3ddca6f33467ae6 # v3.0.0
        env:
          SKIP_UPDATED: 1
