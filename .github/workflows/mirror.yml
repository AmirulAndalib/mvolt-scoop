name: Mirror

on:
  schedule:
    # Every 4 hours, ten minutes before Excavator, so mvolt-mirror finds the new release.
    - cron: '10 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror upstream releases
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Mirror
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The script reads the target repository from GITHUB_REPOSITORY.
        run: ./scripts/mirror-releases.ps1
